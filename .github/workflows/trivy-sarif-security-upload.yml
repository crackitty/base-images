name: Trivy SARIF upload

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Scan scope"
        required: true
        type: choice
        default: all
        options:
          - all
          - single
      image_path:
        description: "Image path under ghcr.io (required for single), e.g. crackitty/base-images/java-21"
        required: false
        type: string
      image_tag:
        description: "Image tag (required for single), e.g. 1.0.0"
        required: false
        type: string

permissions:
  contents: read
  packages: read
  security-events: write
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Build scan matrix
        id: build-matrix
        run: |
          set -euo pipefail

          if [[ "${{ inputs.scope }}" == "single" ]]; then
            if [[ -z "${{ inputs.image_path }}" || -z "${{ inputs.image_tag }}" ]]; then
              echo "image_path and image_tag are required when scope=single" >&2
              exit 1
            fi

            entry=$(jq -n \
              --arg image_path "${{ inputs.image_path }}" \
              --arg tag "${{ inputs.image_tag }}" \
              '{image_path: $image_path, tag: $tag}')
            echo "matrix=[$entry]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          entries='[]'
          while IFS= read -r catalog_file; do
            folder=$(dirname "$catalog_file" | sed 's|^\./||')
            image=$(yq '.metadata.annotations["fleet-management/container-image"] // ""' "$catalog_file")
            catalog_tag=$(yq '.metadata.annotations["fleet-management/current-tag"] // ""' "$catalog_file")

            latest_release_tag=$(git tag -l "${folder}-v*" | sed "s/^${folder}-v//" | sort -V | tail -n1)

            if [[ -n "$latest_release_tag" ]]; then
              tag="$latest_release_tag"
              echo "Using latest release tag for $folder: $tag"
            else
              tag="$catalog_tag"
              echo "Using catalog tag for $folder: $tag"
            fi

            if [[ -z "$image" || -z "$tag" ]]; then
              echo "Skipping $catalog_file - missing image or resolvable tag"
              continue
            fi

            image_path="${image#ghcr.io/}"
            entry=$(jq -n \
              --arg image_path "$image_path" \
              --arg tag "$tag" \
              '{image_path: $image_path, tag: $tag}')

            entries=$(echo "$entries" | jq --argjson e "$entry" '. + [$e]')
          done < <(find . -maxdepth 2 -name catalog-info.yaml -not -path "./catalog-info.yaml")

          if [[ "$entries" == "[]" ]]; then
            echo "No base images discovered for scanning" >&2
            exit 1
          fi

          echo "matrix=$(echo "$entries" | jq -c '.')" >> "$GITHUB_OUTPUT"

  trivy-scan-upload:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build artifact names
        id: names
        run: |
          safe_image=$(echo "${{ matrix.image_path }}" | tr '/:' '__')
          sarif_file="trivy-${safe_image}-${{ matrix.tag }}.sarif"
          category="trivy-image-${safe_image}"
          echo "sarif_file=$sarif_file" >> "$GITHUB_OUTPUT"
          echo "category=$category" >> "$GITHUB_OUTPUT"

      - name: Verify image tag exists in registry
        id: image-check
        run: |
          if docker manifest inspect "ghcr.io/${{ matrix.image_path }}:${{ matrix.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image not found: ghcr.io/${{ matrix.image_path }}:${{ matrix.tag }}"
          fi

      - name: Install Trivy
        if: steps.image-check.outputs.exists == 'true'
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Run Trivy image scan (SARIF)
        if: steps.image-check.outputs.exists == 'true'
        shell: bash
        run: |
          trivy image \
            --format sarif \
            --output "${{ steps.names.outputs.sarif_file }}" \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            "ghcr.io/${{ matrix.image_path }}:${{ matrix.tag }}"

      - name: Upload SARIF to GitHub Security
        if: steps.image-check.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.names.outputs.sarif_file }}
          category: ${{ steps.names.outputs.category }}

      - name: Report missing image tag
        if: steps.image-check.outputs.exists != 'true'
        run: |
          echo "Skipping scan because image tag does not exist in GHCR: ghcr.io/${{ matrix.image_path }}:${{ matrix.tag }}"
